name: Test Homebrew Tap

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    if: ${{ github.event.repository.private == false }}
    runs-on: macos-latest
    strategy:
      matrix:
        tool: [concordui, aethercircle]

    steps:
      - name: Check out tap
        uses: actions/checkout@v4

      - name: Install preview formula
        run: brew install --HEAD --formula Formula/${{ matrix.tool }}.rb

      - name: Test formula
        run: brew test Formula/${{ matrix.tool }}.rb

      - name: Verify temporary CLI
        run: test "$(${{ matrix.tool }} --version)" = "Soon to be released"
